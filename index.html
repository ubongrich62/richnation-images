<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#050506">
<title>RichNation Academy — Student Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800;900&family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#040405;
  --bg2:#0a0b0d;
  --surf:#111318;
  --surf2:#171a20;
  --surf3:#1d212a;
  --bdr:rgba(255,138,0,.22);
  --bdr-soft:rgba(255,255,255,.10);
  --or:#FF8A00;
  --or2:#FFB454;
  --or-dim:rgba(255,138,0,.16);
  --or-glow:rgba(255,138,0,.45);
  --wh:#FFFFFF;
  --w2:#F2F2F2;
  --gr:#2FE6A6;
  --gr-dim:rgba(47,230,166,.16);
  --rd:#FF4D6D;
  --rd-dim:rgba(255,77,109,.16);
  --bl:#4DA3FF;
  --r-lg:20px;
  --r-md:14px;
  --r-sm:10px;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
}
html,body{background:var(--bg);color:var(--w2);font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100%;}
body{font-size:16px;line-height:1.55;}
h1,h2,h3,.hd{font-family:'Poppins',sans-serif;}
button,input,textarea{font-family:inherit;}
::selection{background:var(--or);color:#000;}
a{color:var(--or2);}
.hide{display:none!important;}
button{-webkit-appearance:none;appearance:none;}
::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-thumb{background:var(--surf3);border-radius:99px;}

/* ===== AUTH SCREEN ===== */
#auth{position:fixed;inset:0;background:
  radial-gradient(1100px 700px at 15% -10%, rgba(255,138,0,.16), transparent 60%),
  radial-gradient(900px 600px at 110% 110%, rgba(255,138,0,.10), transparent 55%),
  var(--bg);
  display:flex;align-items:center;justify-content:center;padding:24px;padding-top:calc(24px + var(--safe-t));padding-bottom:calc(24px + var(--safe-b));z-index:1000;overflow-y:auto;}
.auth-card{width:100%;max-width:430px;background:linear-gradient(180deg,var(--surf2),var(--surf));border:1px solid var(--bdr);border-radius:var(--r-lg);padding:38px 30px 32px;box-shadow:0 30px 80px rgba(0,0,0,.55);}
.logo-lockup{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:22px;}
.logo-mark{width:46px;height:46px;flex-shrink:0;filter:drop-shadow(0 0 14px var(--or-glow));}
.logo-text{font-family:'Poppins',sans-serif;font-weight:900;font-size:22px;line-height:1.1;letter-spacing:.2px;}
.logo-text .rich{color:var(--or);}
.logo-text .nation{color:var(--wh);}
.logo-text small{display:block;font-size:10.5px;font-weight:800;letter-spacing:3.5px;color:var(--or2);margin-top:2px;}
.auth-title{font-weight:900;font-size:23px;color:var(--wh);text-align:center;margin-bottom:6px;}
.auth-sub{font-size:14px;color:#b9bcc4;text-align:center;margin-bottom:26px;line-height:1.6;font-weight:600;}
.fld{margin-bottom:16px;}
.fld label{display:block;font-size:12px;color:var(--or2);font-weight:800;text-transform:uppercase;letter-spacing:1.3px;margin-bottom:7px;}
.inp{width:100%;background:var(--surf3);border:1.5px solid var(--bdr-soft);border-radius:var(--r-sm);padding:14px 15px;color:var(--wh);font-size:16px;font-weight:600;outline:none;transition:border-color .15s,box-shadow .15s;}
.inp::placeholder{color:#6b6f7a;font-weight:600;}
.inp:focus{border-color:var(--or);box-shadow:0 0 0 3px var(--or-dim);}
.pw-row{position:relative;}
.pw-row .inp{padding-right:64px;}
.pw-toggle{position:absolute;right:6px;top:6px;bottom:6px;background:var(--surf2);border:1px solid var(--bdr-soft);border-radius:8px;color:var(--or2);font-size:11px;font-weight:800;letter-spacing:.5px;cursor:pointer;padding:0 12px;}
.btn{border:none;border-radius:var(--r-sm);padding:14px;font-weight:800;font-size:15px;cursor:pointer;transition:transform .08s,opacity .15s,box-shadow .15s;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;}
.btn:active{transform:scale(.98);}
.btn-primary{width:100%;background:linear-gradient(135deg,var(--or),#FF6A00);color:#0a0a0a;box-shadow:0 10px 26px rgba(255,138,0,.32);}
.btn-primary:hover{box-shadow:0 12px 32px rgba(255,138,0,.45);}
.btn-outline{background:transparent;border:1.5px solid var(--bdr-soft);color:var(--wh);}
.btn-outline:hover{border-color:var(--or);color:var(--or2);}
.btn-danger{background:var(--rd-dim);border:1.5px solid rgba(255,77,109,.4);color:var(--rd);}
.btn-danger:hover{background:var(--rd);color:#fff;}
.btn-sm{padding:9px 14px;font-size:13px;min-height:38px;border-radius:9px;}
.auth-err{color:var(--rd);font-size:13.5px;font-weight:700;margin-top:14px;padding:11px 13px;background:var(--rd-dim);border:1px solid rgba(255,77,109,.35);border-radius:var(--r-sm);text-align:center;display:none;}
.auth-foot{margin-top:22px;text-align:center;font-size:13px;color:#9a9da5;font-weight:600;line-height:1.7;}
.auth-foot a{color:var(--or2);font-weight:800;text-decoration:none;}
.auth-foot a:hover{text-decoration:underline;}

/* ===== APP SHELL ===== */
#app{display:none;min-height:100vh;flex-direction:column;background:var(--bg);}
.topbar{position:sticky;top:0;z-index:200;height:64px;padding-top:var(--safe-t);background:rgba(10,11,13,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--bdr-soft);display:flex;align-items:center;gap:14px;padding-left:18px;padding-right:14px;flex-shrink:0;}
.tb-logo{display:flex;align-items:center;gap:9px;flex-shrink:0;}
.tb-logo .logo-mark{width:30px;height:30px;filter:drop-shadow(0 0 8px var(--or-glow));}
.tb-logo .logo-text{font-size:15px;}
.tb-logo .logo-text small{font-size:8px;letter-spacing:2.5px;}
.tb-greet{display:none;font-weight:800;color:var(--wh);font-size:14.5px;}
.tb-space{flex:1;}
.icon-btn{position:relative;width:42px;height:42px;border-radius:12px;background:var(--surf2);border:1px solid var(--bdr-soft);color:var(--w2);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}
.icon-btn:hover{border-color:var(--or);color:var(--or2);}
.icon-btn svg{width:19px;height:19px;}
.dot-badge{position:absolute;top:-4px;right:-4px;background:var(--rd);color:#fff;font-size:10px;font-weight:900;min-width:18px;height:18px;border-radius:99px;display:none;align-items:center;justify-content:center;padding:0 4px;border:2px solid var(--bg2);}
.dot-badge.show{display:flex;}
.notif-panel{position:absolute;top:calc(100% + 10px);right:14px;width:min(360px,92vw);background:var(--surf2);border:1px solid var(--bdr-soft);border-radius:var(--r-md);box-shadow:0 20px 50px rgba(0,0,0,.6);z-index:999;display:none;overflow:hidden;}
.notif-panel.open{display:block;}
.notif-hd{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--bdr-soft);}
.notif-hd b{font-size:14px;color:var(--wh);}
.notif-hd button{background:none;border:none;color:var(--or2);font-size:12px;font-weight:800;cursor:pointer;}
.notif-list{max-height:380px;overflow-y:auto;}
.notif-item{padding:13px 16px;border-bottom:1px solid var(--bdr-soft);display:flex;gap:10px;}
.notif-item:last-child{border-bottom:none;}
.notif-item.unread{background:rgba(255,138,0,.05);}
.n-dot{width:8px;height:8px;border-radius:50%;background:var(--or);flex-shrink:0;margin-top:6px;}
.n-dot.read{background:transparent;border:1px solid #4a4d55;}
.n-lbl{font-size:13px;font-weight:800;color:var(--wh);margin-bottom:2px;}
.n-txt{font-size:12.5px;color:#b3b6bd;font-weight:600;line-height:1.5;}
.n-time{font-size:11px;color:#6b6f7a;margin-top:4px;font-weight:600;}
.notif-empty{padding:30px 16px;text-align:center;color:#7a7d85;font-size:13px;font-weight:600;}

.body-row{display:flex;flex:1;min-height:0;}
.view{flex:1;min-width:0;overflow-y:auto;padding:20px 18px 110px;}
@media(min-width:640px){.view{padding:28px 32px 120px;}}
.wrap{max-width:980px;margin:0 auto;}

/* ===== TAB BAR (the 3 tabs) ===== */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:300;display:flex;background:rgba(10,11,13,.96);backdrop-filter:blur(12px);border-top:1px solid var(--bdr-soft);padding-bottom:var(--safe-b);box-shadow:0 -8px 24px rgba(0,0,0,.35);}
.tab-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:10px 4px 8px;background:none;border:none;color:#7d8088;cursor:pointer;font-size:11.5px;font-weight:800;letter-spacing:.2px;position:relative;min-height:58px;}
.tab-btn svg{width:23px;height:23px;stroke:currentColor;}
.tab-btn.on{color:var(--or);}
.tab-btn.on::before{content:'';position:absolute;top:0;left:20%;right:20%;height:3px;border-radius:0 0 4px 4px;background:var(--or);box-shadow:0 0 10px var(--or-glow);}
.tab-badge{position:absolute;top:4px;right:26%;background:var(--rd);color:#fff;font-size:9px;font-weight:900;min-width:15px;height:15px;border-radius:99px;display:none;align-items:center;justify-content:center;padding:0 3px;}
.tab-badge.show{display:flex;}

@media(min-width:1024px){
  .body-row{position:relative;}
  .tabbar{position:sticky;top:64px;left:auto;right:auto;bottom:auto;flex-direction:column;width:224px;flex-shrink:0;height:calc(100vh - 64px);padding:18px 12px;border-top:none;border-right:1px solid var(--bdr-soft);box-shadow:none;align-items:stretch;gap:6px;}
  .tab-btn{flex:none;flex-direction:row;justify-content:flex-start;gap:13px;padding:13px 16px;border-radius:var(--r-sm);min-height:auto;}
  .tab-btn.on{background:var(--or-dim);}
  .tab-btn.on::before{display:none;}
  .tab-btn span.lbl{font-size:14.5px;}
  .tab-badge{top:10px;right:16px;}
  .view{padding:32px 40px 60px;}
  .tb-greet{display:block;}
}

/* ===== SHARED COMPONENTS ===== */
.page-hd{font-weight:900;font-size:25px;color:var(--wh);margin-bottom:5px;}
.page-sub{font-size:14.5px;color:#a9acb3;font-weight:600;margin-bottom:22px;line-height:1.6;}
.card{background:linear-gradient(180deg,var(--surf2),var(--surf));border:1px solid var(--bdr-soft);border-radius:var(--r-lg);padding:20px;margin-bottom:16px;}
.card-title{font-weight:800;font-size:16.5px;color:var(--wh);margin-bottom:4px;}
.card-sub{font-size:13.5px;color:#9fa2aa;font-weight:600;margin-bottom:14px;line-height:1.6;}
.announcement{background:linear-gradient(135deg,rgba(255,138,0,.16),rgba(255,138,0,.05));border:1.5px solid var(--bdr);border-radius:var(--r-lg);padding:16px 18px;margin-bottom:18px;display:flex;gap:12px;align-items:flex-start;}
.announcement svg{width:20px;height:20px;flex-shrink:0;color:var(--or);margin-top:2px;}
.announcement b{color:var(--or2);font-size:11.5px;text-transform:uppercase;letter-spacing:1.2px;display:block;margin-bottom:4px;}
.announcement p{color:var(--wh);font-size:14.5px;font-weight:700;line-height:1.6;}

.ring-row{display:flex;align-items:center;gap:20px;flex-wrap:wrap;}
.ring{position:relative;width:104px;height:104px;flex-shrink:0;}
.ring svg{transform:rotate(-90deg);width:104px;height:104px;}
.ring-num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.ring-num b{font-size:24px;font-weight:900;color:var(--wh);}
.ring-num span{font-size:10px;color:#9a9da5;font-weight:800;text-transform:uppercase;letter-spacing:.8px;}

.stat-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:18px 0;}
.stat-box{background:var(--surf2);border:1px solid var(--bdr-soft);border-radius:var(--r-md);padding:12px 6px;text-align:center;min-width:0;}
.stat-box b{display:block;font-size:22px;font-weight:900;color:var(--or);}
.stat-box span{font-size:10.5px;color:#9a9da5;font-weight:800;text-transform:uppercase;letter-spacing:.5px;word-break:break-word;}

.continue-card{display:flex;align-items:center;gap:16px;background:linear-gradient(135deg,#1c1300,var(--surf2));border:1.5px solid var(--bdr);border-radius:var(--r-lg);padding:18px;margin-bottom:18px;cursor:pointer;}
.continue-icon{width:52px;height:52px;border-radius:14px;background:var(--or);color:#0a0a0a;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.continue-icon svg{width:24px;height:24px;}
.continue-info b{display:block;font-size:11px;color:var(--or2);text-transform:uppercase;letter-spacing:1.2px;font-weight:800;margin-bottom:3px;}
.continue-info .ct-title{font-size:16px;font-weight:800;color:var(--wh);line-height:1.4;}
.continue-arrow{margin-left:auto;flex-shrink:0;color:var(--or);}

.course-grid{display:grid;grid-template-columns:1fr;gap:14px;}
@media(min-width:640px){.course-grid{grid-template-columns:1fr 1fr;}}
@media(min-width:1280px){.course-grid{grid-template-columns:1fr 1fr 1fr;}}
.course-card{background:var(--surf2);border:1px solid var(--bdr-soft);border-radius:var(--r-lg);padding:18px;cursor:pointer;transition:border-color .15s,transform .1s;}
.course-card:hover{border-color:var(--cc,var(--or));transform:translateY(-2px);}
.course-top{display:flex;align-items:center;gap:12px;margin-bottom:10px;}
.course-num{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px;flex-shrink:0;color:#0a0a0a;}
.course-title{font-weight:800;font-size:15.5px;color:var(--wh);line-height:1.35;}
.course-sub{font-size:12.5px;color:#9fa2aa;font-weight:600;margin-bottom:14px;line-height:1.55;min-height:34px;}
.course-progress-row{display:flex;align-items:center;gap:9px;}
.pbar{flex:1;height:7px;background:var(--surf3);border-radius:99px;overflow:hidden;}
.pbar-fill{height:100%;border-radius:99px;transition:width .4s;}
.pbar-pct{font-size:12px;font-weight:800;color:var(--wh);flex-shrink:0;width:36px;text-align:right;}
.course-meta{font-size:11.5px;color:#7d8088;font-weight:700;margin-top:8px;}
.complete-tag{display:inline-flex;align-items:center;gap:4px;background:var(--gr-dim);color:var(--gr);font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:99px;margin-top:8px;}

.back-btn{display:inline-flex;align-items:center;gap:7px;background:var(--surf2);border:1px solid var(--bdr-soft);border-radius:99px;padding:9px 16px;color:var(--wh);font-size:13.5px;font-weight:800;cursor:pointer;margin-bottom:18px;}
.back-btn:hover{border-color:var(--or);color:var(--or2);}
.back-btn svg{width:16px;height:16px;}

.lesson-row{display:flex;align-items:center;gap:14px;background:var(--surf2);border:1px solid var(--bdr-soft);border-radius:var(--r-md);padding:15px 16px;margin-bottom:10px;cursor:pointer;}
.lesson-row:hover{border-color:var(--bdr);}
.lesson-chk{width:30px;height:30px;border-radius:50%;border:2px solid #3d4048;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:transparent;}
.lesson-chk.done{background:var(--gr);border-color:var(--gr);color:#08120e;}
.lesson-chk svg{width:16px;height:16px;}
.lesson-num{width:30px;height:30px;border-radius:50%;border:2px solid var(--bdr);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:12px;font-weight:800;color:var(--or2);}
.lesson-info{flex:1;min-width:0;}
.lesson-info b{display:block;font-size:14.5px;font-weight:800;color:var(--wh);line-height:1.45;}
.lesson-info span{font-size:12px;color:#8a8d94;font-weight:700;}
.lesson-go{flex-shrink:0;color:#6b6f7a;}
.lesson-go svg{width:18px;height:18px;}

.video-frame{width:100%;aspect-ratio:16/9;background:#000;border-radius:var(--r-lg);overflow:hidden;border:1px solid var(--bdr-soft);margin-bottom:18px;}
.video-frame iframe{border:0;width:100%;height:100%;}
.video-empty{width:100%;aspect-ratio:16/9;background:var(--surf2);border:1.5px dashed var(--bdr-soft);border-radius:var(--r-lg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#7d8088;margin-bottom:18px;text-align:center;padding:20px;}
.video-empty svg{width:34px;height:34px;opacity:.5;}
.video-empty b{font-size:13.5px;font-weight:800;color:#9fa2aa;}
.lesson-body{color:var(--w2);font-size:15.5px;line-height:1.85;font-weight:500;}
.lesson-body p{margin-bottom:14px;}
.lesson-body strong{color:var(--wh);}
.lesson-nav{display:flex;gap:10px;margin-top:24px;}
.lesson-nav .btn{flex:1;}
.mark-btn{width:100%;margin:20px 0;}
.mark-btn.done-state{background:linear-gradient(135deg,var(--gr),#1fc98a);color:#05130d;box-shadow:0 10px 26px rgba(47,230,166,.28);}

.chat-box{display:flex;flex-direction:column;height:340px;}
.chat-messages{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:14px;background:var(--surf3);border-radius:var(--r-md);margin-bottom:12px;}
.chat-msg{max-width:78%;padding:11px 15px;border-radius:14px;font-size:14px;font-weight:600;line-height:1.6;}
.chat-msg.mine{background:var(--or);color:#0a0a0a;align-self:flex-end;border-bottom-right-radius:4px;font-weight:700;}
.chat-msg.theirs{background:var(--surf2);border:1px solid var(--bdr-soft);color:var(--w2);align-self:flex-start;border-bottom-left-radius:4px;}
.chat-time{font-size:10.5px;color:#7d8088;margin-top:3px;font-weight:700;}
.chat-compose{display:flex;gap:9px;}
.chat-input{flex:1;background:var(--surf3);border:1.5px solid var(--bdr-soft);border-radius:var(--r-sm);padding:12px 14px;color:var(--wh);font-size:14.5px;font-weight:600;outline:none;resize:none;height:48px;}
.chat-input:focus{border-color:var(--or);}
.chat-send{background:var(--or);color:#0a0a0a;border:none;border-radius:var(--r-sm);width:48px;height:48px;flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.chat-send svg{width:19px;height:19px;}

.appt-item{background:var(--surf2);border:1px solid var(--bdr-soft);border-radius:var(--r-md);padding:14px 16px;margin-bottom:10px;}
.appt-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
.appt-when{font-weight:800;color:var(--or2);font-size:14px;}
.appt-topic{font-size:13.5px;color:var(--w2);font-weight:600;margin-top:3px;}
.appt-note{font-size:12.5px;color:#9fa2aa;margin-top:5px;font-weight:600;}
.status-chip{font-size:10.5px;font-weight:800;padding:4px 10px;border-radius:99px;flex-shrink:0;text-transform:capitalize;}
.status-chip.pending{background:rgba(77,163,255,.16);color:var(--bl);}
.status-chip.confirmed{background:var(--gr-dim);color:var(--gr);}
.status-chip.cancelled{background:var(--rd-dim);color:var(--rd);}

.profile-hero{display:flex;align-items:center;gap:16px;margin-bottom:22px;}
.avatar-lg{width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,var(--or),#FF6A00);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:22px;color:#0a0a0a;flex-shrink:0;}
.profile-hero h2{font-size:20px;font-weight:900;color:var(--wh);}
.profile-hero p{font-size:13.5px;color:#9fa2aa;font-weight:600;margin-top:2px;}

.subtabs{display:flex;gap:8px;margin-bottom:18px;overflow-x:auto;padding-bottom:2px;}
.subtab{flex-shrink:0;background:var(--surf2);border:1.5px solid var(--bdr-soft);color:#a9acb3;font-size:13px;font-weight:800;padding:10px 16px;border-radius:99px;cursor:pointer;white-space:nowrap;}
.subtab.on{background:var(--or);border-color:var(--or);color:#0a0a0a;}

.form-grid{display:grid;grid-template-columns:1fr;gap:14px;}
@media(min-width:560px){.form-grid.two{grid-template-columns:1fr 1fr;}}

#toast{position:fixed;bottom:calc(20px + var(--safe-b));left:50%;transform:translateX(-50%);z-index:9999;pointer-events:none;display:flex;flex-direction:column;gap:8px;align-items:center;width:calc(100% - 32px);}

/* ===================== AUTH ===================== */
async function doAuth(){
  const email=(document.getElementById('s-email').value||'').trim().toLowerCase();
  const pass=(document.getElementById('s-pass').value||'').trim();
  const err=document.getElementById('s-err');
  err.style.display='none';
  if(!email||!pass){err.textContent='Please enter your email and password.';err.style.display='block';return;}
  const btn=document.getElementById('s-btn');btn.textContent='Signing in...';btn.disabled=true;
  const uid=email.replace(/[.@+]/g,'_');
  const student=await fbG('rna_students/'+uid);
  btn.textContent='Sign In';btn.disabled=false;
  if(!student||student.role==='admin'||(student.password||'')!==pass){
    err.textContent='Incorrect email or password. Please check with your tutor.';err.style.display='block';return;
  }
  if(student.status==='disabled'){
    err.textContent='Your account has been disabled. Please contact your tutor.';err.style.display='block';return;
  }
  if(student.status!=='active'){
    err.textContent='Your account is not active yet. Your tutor will activate it shortly.';err.style.display='block';return;
  }
  localStorage.setItem('rna_uid',uid);
  UID=uid;ME=student;
  launchApp();
}
function doSignOut(){
  localStorage.removeItem('rna_uid');
  document.getElementById('app').style.display='none';
  document.getElementById('auth').style.display='flex';
  UID=null;ME=null;
}
async function launchApp(){
  document.getElementById('auth').style.display='none';
  document.getElementById('app').style.display='flex';
  document.getElementById('tb-greet').textContent='Hi, '+(ME.name||'').split(' ')[0]+'!';
  PROGRESS=await fbG('rna_progress/'+UID)||{};
  goTab('home');
  loadMyNotifs();
  setInterval(loadMyNotifs,15000);
  setInterval(async()=>{PROGRESS=await fbG('rna_progress/'+UID)||{};},20000);
}

/* ===================== TABS ===================== */
function goTab(tab){
  CURRENT_TAB=tab;CURRENT_COURSE=null;CURRENT_LESSON=null;
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('on'));
  document.getElementById('tab-'+tab).classList.add('on');
  document.getElementById('view').scrollTop=0;
  if(tab==='home')renderHome();
  else if(tab==='courses')renderCourseList();
  else if(tab==='profile')renderProfile('overview');
}

/* ===================== PROGRESS HELPERS ===================== */
function courseDone(c){return c.lessons.filter(l=>PROGRESS[c.id]&&PROGRESS[c.id].done&&PROGRESS[c.id].done[l.id]).length;}
function totalDone(){return COURSES.reduce((s,c)=>s+courseDone(c),0);}
function nextLesson(){
  for(const c of COURSES){for(const l of c.lessons){if(!(PROGRESS[c.id]&&PROGRESS[c.id].done&&PROGRESS[c.id].done[l.id]))return{course:c,lesson:l};}}
  return null;
}

/* ===================== HOME ===================== */
async function renderHome(){
  const V=document.getElementById('view');
  const done=totalDone();const pct=Math.round(done/TOTAL_LESSONS*100)||0;
  const nx=nextLesson();
  const settings=await fbG('rna_settings')||{};
  const circumference=2*Math.PI*46;
  const offset=circumference-(pct/100)*circumference;
  V.innerHTML=`<div class="wrap">
    <div class="page-hd">Welcome back, ${esc((ME.name||'').split(' ')[0])}</div>
    <div class="page-sub">Here is where you left off. Keep going — every lesson brings you closer.</div>
    ${settings.announcement?`<div class="announcement">${ICON_MEGA}<div><b>Announcement</b><p>${esc(settings.announcement)}</p></div></div>`:''}
    <div class="card">
      <div class="ring-row">
        <div class="ring">
          <svg viewBox="0 0 104 104"><circle cx="52" cy="52" r="46" stroke="#1d212a" stroke-width="9" fill="none"/><circle cx="52" cy="52" r="46" stroke="#FF8A00" stroke-width="9" fill="none" stroke-linecap="round" stroke-dasharray="${circumference}" stroke-dashoffset="${offset}"/></svg>
          <div class="ring-num"><b>${pct}%</b><span>Done</span></div>
        </div>
        <div style="flex:1;min-width:180px">
          <div class="card-title" style="margin-bottom:10px">Overall Progress</div>
          <div class="stat-grid" style="margin:0">
            <div class="stat-box"><b>${done}</b><span>Done</span></div>
            <div class="stat-box"><b>${TOTAL_LESSONS-done}</b><span>Left</span></div>
            <div class="stat-box"><b>${COURSES.filter(c=>courseDone(c)>=c.lessons.length).length}</b><span>Courses</span></div>
          </div>
        </div>
      </div>
    </div>
    ${nx?`<div class="continue-card" onclick="openLesson('${nx.course.id}','${nx.lesson.id}')">
      <div class="continue-icon">${ICON_PLAY}</div>
      <div class="continue-info"><b>Continue Learning</b><div class="ct-title">${esc(nx.lesson.title)}</div></div>
      <div class="continue-arrow">${ICON_CHEVRON}</div>
    </div>`:`<div class="card" style="text-align:center;padding:34px 20px">
      <div style="font-size:17px;font-weight:900;color:var(--or2);margin-bottom:6px">You have completed every lesson!</div>
      <div style="font-size:13.5px;color:#9fa2aa;font-weight:600">Amazing work. Message your tutor for what is next.</div>
    </div>`}
    <div class="card-title" style="margin:22px 0 12px">Your Courses</div>
    <div class="course-grid">
      ${COURSES.slice(0,6).map(c=>courseCardHTML(c)).join('')}
    </div>
    <div style="text-align:center;margin-top:6px">
      <button class="btn btn-outline btn-sm" onclick="goTab('courses')">View All 12 Courses</button>
    </div>
  </div>`;
}

function courseCardHTML(c){
  const done=courseDone(c);const pct=Math.round(done/c.lessons.length*100);
  const complete=done>=c.lessons.length;
  return`<div class="course-card" style="--cc:${c.color}" onclick="openCourse('${c.id}')">
    <div class="course-top">
      <div class="course-num" style="background:${c.color}">${c.icon}</div>
      <div class="course-title">${esc(c.title)}</div>
    </div>
    <div class="course-sub">${esc(c.sub)}</div>
    <div class="course-progress-row">
      <div class="pbar"><div class="pbar-fill" style="width:${pct}%;background:${c.color}"></div></div>
      <div class="pbar-pct">${pct}%</div>
    </div>
    <div class="course-meta">${c.lessons.length} lessons</div>
    ${complete?`<div class="complete-tag">${ICON_CHECK} Complete</div>`:''}
  </div>`;
}

/* ===================== COURSES ===================== */
function renderCourseList(){
  const V=document.getElementById('view');
  V.innerHTML=`<div class="wrap">
    <div class="page-hd">Your Courses</div>
    <div class="page-sub">12 courses. ${TOTAL_LESSONS} lessons. Learn at your own pace — nothing here is locked.</div>
    <div class="course-grid">${COURSES.map(c=>courseCardHTML(c)).join('')}</div>
  </div>`;
}

async function openCourse(cid){
  CURRENT_COURSE=cid;
  const c=COURSES.find(x=>x.id===cid);
  const edits=(await fbG('rna_course_edits/'+cid))||{};
  const V=document.getElementById('view');
  const done=courseDone(c);const pct=Math.round(done/c.lessons.length*100);
  V.innerHTML=`<div class="wrap">
    <button class="back-btn" onclick="goTab('courses')">${ICON_BACK} All Courses</button>
    <div style="display:flex;align-items:center;gap:14px;margin-bottom:8px">
      <div class="course-num" style="width:52px;height:52px;font-size:17px;background:${c.color}">${c.icon}</div>
      <div>
        <div class="page-hd" style="margin-bottom:2px">${esc(edits.title||c.title)}</div>
        <div style="font-size:13.5px;color:#9fa2aa;font-weight:600">${esc(edits.sub||c.sub)}</div>
      </div>
    </div>
    <div class="card" style="margin-top:16px">
      <div style="display:flex;align-items:center;gap:12px">
        <div class="pbar"><div class="pbar-fill" style="width:${pct}%;background:${c.color}"></div></div>
        <div class="pbar-pct">${pct}%</div>
      </div>
      <div class="course-meta" style="margin-top:8px">${done} of ${c.lessons.length} lessons complete</div>
    </div>
    <div class="card-title" style="margin:20px 0 12px">Lessons</div>
    ${c.lessons.map((l,i)=>{
      const dn=PROGRESS[c.id]&&PROGRESS[c.id].done&&PROGRESS[c.id].done[l.id];
      const title=(edits.lessons&&edits.lessons[i])||l.title;
      const dur=(edits.lessonDurs&&edits.lessonDurs[i])||l.dur;
      return`<div class="lesson-row" onclick="openLesson('${c.id}','${l.id}')">
        <div class="lesson-chk ${dn?'done':''}">${dn?ICON_CHECK:''}</div>
        <div class="lesson-info"><b>${esc(title)}</b><span>${esc(dur)}</span></div>
        <div class="lesson-go">${ICON_CHEVRON}</div>
      </div>`;
    }).join('')}
  </div>`;
}

async function openLesson(cid,lid){
  CURRENT_COURSE=cid;CURRENT_LESSON=lid;
  const c=COURSES.find(x=>x.id===cid);
  const idx=c.lessons.findIndex(l=>l.id===lid);
  const l=c.lessons[idx];
  const [edits,vids,content]=await Promise.all([
    fbG('rna_course_edits/'+cid)||{},
    fbG('rna_videos')||{},
    fbG('rna_lesson_content/'+lid)
  ]);
  const title=(edits&&edits.lessons&&edits.lessons[idx])||l.title;
  const dur=(edits&&edits.lessonDurs&&edits.lessonDurs[idx])||l.dur;
  const vk=cid+'_'+lid;
  const vurl=vids?vids[vk]:'';
  const dn=PROGRESS[cid]&&PROGRESS[cid].done&&PROGRESS[cid].done[lid];
  let videoHTML;
  if(vurl){
    const m=vurl.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/))([a-zA-Z0-9_-]{11})/);
    videoHTML=m?`<div class="video-frame"><iframe src="https://www.youtube-nocookie.com/embed/${m[1]}?rel=0&modestbranding=1&fs=1" allowfullscreen allow="accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture;web-share" referrerpolicy="strict-origin-when-cross-origin"></iframe></div>`
      :'';
  } else {
    videoHTML=`<div class="video-empty">${ICON_PLAY}<b>Video coming soon</b><span style="font-size:12px;font-weight:600">Your tutor has not added a video for this lesson yet.</span></div>`;
  }
  const body=content||`<p>This lesson is part of <strong>${esc(edits&&edits.title||c.title)}</strong>. Watch the video above, then message your tutor from the Profile tab if you have any questions.</p>`;
  const prev=idx>0?c.lessons[idx-1]:null;
  const next=idx<c.lessons.length-1?c.lessons[idx+1]:null;
  const V=document.getElementById('view');
  V.innerHTML=`<div class="wrap">
    <button class="back-btn" onclick="openCourse('${cid}')">${ICON_BACK} ${esc(edits&&edits.title||c.title)}</button>
    <div class="page-hd" style="font-size:22px">${esc(title)}</div>
    <div class="page-sub" style="margin-bottom:18px">${esc(dur)} &middot; Lesson ${idx+1} of ${c.lessons.length}</div>
    ${videoHTML}
    <div class="lesson-body">${body}</div>
    <button class="btn mark-btn ${dn?'done-state':'btn-primary'}" onclick="toggleLessonDone('${cid}','${lid}')">${dn?ICON_CHECK+' Completed — tap to undo':'Mark Lesson Complete'}</button>
    <div class="lesson-nav">
      <button class="btn btn-outline" ${prev?'':'disabled style="opacity:.4;pointer-events:none"'} onclick="${prev?`openLesson('${cid}','${prev.id}')`:''}">${ICON_BACK} Previous</button>
      <button class="btn btn-outline" ${next?'':'disabled style="opacity:.4;pointer-events:none"'} onclick="${next?`openLesson('${cid}','${next.id}')`:''}">Next ${ICON_CHEVRON}</button>
    </div>
  </div>`;
}

async function toggleLessonDone(cid,lid){
  if(!PROGRESS[cid])PROGRESS[cid]={done:{}};
  if(!PROGRESS[cid].done)PROGRESS[cid].done={};
  const isDone=!!PROGRESS[cid].done[lid];
  if(isDone){delete PROGRESS[cid].done[lid];}
  else{PROGRESS[cid].done[lid]=new Date().toISOString();}
  await fbU('rna_progress/'+UID,{[cid]:PROGRESS[cid]});
  toast(isDone?'Marked as not done.':'Lesson complete! Great work.','ok');
  openLesson(cid,lid);
}

/* ===================== PROFILE ===================== */
let PROFILE_SUB='overview';
async function renderProfile(sub){
  PROFILE_SUB=sub||PROFILE_SUB;
  const V=document.getElementById('view');
  V.innerHTML=`<div class="wrap">
    <div class="profile-hero">
      <div class="avatar-lg">${initials(ME.name)}</div>
      <div><h2>${esc(ME.name||'')}</h2><p>${esc(ME.email||'')}${ME.phone?' &middot; '+esc(ME.phone):''}</p></div>
    </div>
    <div class="subtabs">
      <button class="subtab ${PROFILE_SUB==='overview'?'on':''}" onclick="renderProfile('overview')">Overview</button>
      <button class="subtab ${PROFILE_SUB==='messages'?'on':''}" onclick="renderProfile('messages')">Messages</button>
      <button class="subtab ${PROFILE_SUB==='appointments'?'on':''}" onclick="renderProfile('appointments')">Appointments</button>
    </div>
    <div id="profile-content"><div class="loading-txt">Loading...</div></div>
  </div>`;
  const PC=document.getElementById('profile-content');
  if(PROFILE_SUB==='overview'){
    const done=totalDone();const pct=Math.round(done/TOTAL_LESSONS*100)||0;
    PC.innerHTML=`
      <div class="card">
        <div class="card-title">Your Learning Journey</div>
        <div class="card-sub">${pct}% complete &middot; ${done} of ${TOTAL_LESSONS} lessons</div>
        <div class="pbar" style="height:9px"><div class="pbar-fill" style="width:${pct}%;background:var(--or)"></div></div>
      </div>
      <div class="card">
        <div class="card-title">Account Details</div>
        <div style="font-size:14px;color:var(--w2);font-weight:600;line-height:2.1">
          Full Name: <strong style="color:var(--wh)">${esc(ME.name||'')}</strong><br>
          Email: <strong style="color:var(--wh)">${esc(ME.email||'')}</strong><br>
          Phone: <strong style="color:var(--wh)">${esc(ME.phone||'Not provided')}</strong><br>
          Joined: <strong style="color:var(--wh)">${fmtDate(ME.createdAt)}</strong>
        </div>
      </div>
      <button class="btn btn-danger" style="width:100%" onclick="doSignOut()">Sign Out</button>
    `;
  } else if(PROFILE_SUB==='messages'){
    PC.innerHTML=`<div class="card">
      <div class="card-title">Message Your Tutor</div>
      <div class="card-sub">Ask questions any time. Your tutor typically replies within a day.</div>
      <div class="chat-box">
        <div class="chat-messages" id="chat-msgs"><div class="loading-txt">Loading...</div></div>
        <div class="chat-compose">
          <textarea class="chat-input" id="chat-inp" placeholder="Type a message..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage();}"></textarea>
          <button class="chat-send" onclick="sendMessage()">${ICON_SEND}</button>
        </div>
      </div>
    </div>`;
    loadMessages();
  } else if(PROFILE_SUB==='appointments'){
    PC.innerHTML=`<div class="card">
      <div class="card-title">Book a Session</div>
      <div class="card-sub">Request a 1-on-1 call with your tutor.</div>
      <div class="form-grid two" style="margin-bottom:12px">
        <div class="fld" style="margin:0"><label>Date</label><input class="inp" id="ap-date" type="date"></div>
        <div class="fld" style="margin:0"><label>Time</label><input class="inp" id="ap-time" type="time"></div>
      </div>
      <div class="fld"><label>Topic</label><input class="inp" id="ap-topic" placeholder="What would you like to discuss?"></div>
      <div class="fld"><label>Notes (optional)</label><input class="inp" id="ap-notes" placeholder="Anything else your tutor should know"></div>
      <button class="btn btn-primary" onclick="requestAppointment()">${ICON_CAL} Request Appointment</button>
    </div>
    <div class="card-title" style="margin:20px 0 12px">Your Appointments</div>
    <div id="appt-list"><div class="loading-txt">Loading...</div></div>`;
    loadAppointments();
  }
}

async function loadMessages(){
  const msgs=await fbG('rna_messages/'+UID)||{};
  const list=Object.values(msgs).sort((a,b)=>a.ts-b.ts);
  const el=document.getElementById('chat-msgs');if(!el)return;
  el.innerHTML=!list.length?'<div class="empty-state" style="padding:24px"><span>No messages yet. Say hello!</span></div>'
    :list.map(m=>`<div style="align-self:${m.from==='student'?'flex-end':'flex-start'}">
      <div class="chat-msg ${m.from==='student'?'mine':'theirs'}">${esc(m.text)}</div>
      <div class="chat-time" style="${m.from==='student'?'text-align:right':''}">${m.date||fmtTS(m.ts)}</div>
    </div>`).join('');
  el.scrollTop=el.scrollHeight;
}
async function sendMessage(){
  const inp=document.getElementById('chat-inp');
  const text=(inp.value||'').trim();if(!text)return;
  inp.value='';
  const msg={id:Date.now().toString(),text,from:'student',ts:Date.now(),date:nowStr()};
  await fbP('rna_messages/'+UID,msg);
  await fbP('rna_admin_notifications',{type:'message',from:ME.name,uid:UID,preview:text,ts:Date.now(),read:false});
  loadMessages();
}
async function loadAppointments(){
  const appts=await fbG('rna_appointments/'+UID)||{};
  const list=Object.values(appts).sort((a,b)=>b.ts-a.ts);
  const el=document.getElementById('appt-list');if(!el)return;
  el.innerHTML=!list.length?`<div class="empty-state">${ICON_CAL}<b>No appointments yet</b><span>Use the form above to request one.</span></div>`
    :list.map(a=>`<div class="appt-item">
      <div class="appt-top">
        <div><div class="appt-when">${a.date} at ${a.time}</div><div class="appt-topic">${esc(a.topic||'')}</div>${a.adminNote?`<div class="appt-note">Tutor note: ${esc(a.adminNote)}</div>`:''}</div>
        <span class="status-chip ${a.status||'pending'}">${a.status||'pending'}</span>
      </div>
    </div>`).join('');
}
async function requestAppointment(){
  const date=(document.getElementById('ap-date').value||'').trim();
  const time=(document.getElementById('ap-time').value||'').trim();
  const topic=(document.getElementById('ap-topic').value||'').trim();
  const notes=(document.getElementById('ap-notes').value||'').trim();
  if(!date||!time||!topic){toast('Please fill in date, time, and topic.','err');return;}
  const appt={id:Date.now().toString(),date,time,topic,notes,status:'pending',ts:Date.now()};
  await fbP('rna_appointments/'+UID,appt);
  await fbP('rna_admin_notifications',{type:'appointment',from:ME.name,uid:UID,date,time,ts:Date.now(),read:false});
  toast('Appointment requested. Your tutor will confirm soon.','ok');
  ['ap-date','ap-time','ap-topic','ap-notes'].forEach(id=>{document.getElementById(id).value='';});
  loadAppointments();
}

/* ===================== NOTIFICATIONS ===================== */
async function loadMyNotifs(){
  if(!UID)return;
  const raw=await fbG('rna_notifications/'+UID)||{};
  const all=Object.entries(raw).map(([k,v])=>({...v,_key:k})).sort((a,b)=>b.ts-a.ts);
  const unread=all.filter(n=>!n.read);
  const badge=document.getElementById('notif-badge');
  if(badge){badge.textContent=unread.length>9?'9+':String(unread.length);badge.classList.toggle('show',unread.length>0);}
  const cb=document.getElementById('tab-badge-profile');
  if(cb){cb.textContent=unread.length>9?'9+':String(unread.length);cb.classList.toggle('show',unread.length>0);}
  const list=document.getElementById('notif-list');if(!list)return;
  const lbls={message_reply:'Reply from Tutor',admin_broadcast:'Announcement',appt_confirmed:'Appointment Confirmed',appt_declined:'Appointment Update'};
  if(!all.length){list.innerHTML='<div class="notif-empty">No notifications yet.</div>';return;}
  list.innerHTML=all.slice(0,40).map(n=>`<div class="notif-item ${!n.read?'unread':''}" onclick="openNotif('${n._key}')">
    <div class="n-dot ${n.read?'read':''}"></div>
    <div style="flex:1;min-width:0">
      <div class="n-lbl">${esc(lbls[n.type]||'Notification')}</div>
      <div class="n-txt">${esc((n.text||n.msg||'').slice(0,90))}</div>
      <div class="n-time">${fmtTS(n.ts)}</div>
    </div>
  </div>`).join('');
}
async function openNotif(key){
  await fbU('rna_notifications/'+UID+'/'+key,{read:true});
  toggleNotif(true);
  loadMyNotifs();
}
function toggleNotif(forceClose){
  const p=document.getElementById('notif-panel');
  if(forceClose||p.classList.contains('open')){p.classList.remove('open');return;}
  p.classList.add('open');
}
async function clearMyNotifs(){
  const raw=await fbG('rna_notifications/'+UID)||{};
  for(const k of Object.keys(raw))await fbU('rna_notifications/'+UID+'/'+k,{read:true});
  loadMyNotifs();
}
document.addEventListener('click',e=>{
  const p=document.getElementById('notif-panel');const b=document.getElementById('notif-btn');
  if(p&&b&&!p.contains(e.target)&&!b.contains(e.target))p.classList.remove('open');
});

/* ===================== BOOT ===================== */
document.addEventListener('DOMContentLoaded',async function(){
  const uid=localStorage.getItem('rna_uid');
  if(!uid)return;
  const student=await fbG('rna_students/'+uid);
  if(student&&student.status==='active'){UID=uid;ME=student;launchApp();}
  else{localStorage.removeItem('rna_uid');}
});
</script>
</body>
