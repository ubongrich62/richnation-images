<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Set Admin Password, RichNation Mall</title>
<style>
:root{--bg:#0A0A0B;--card:#111113;--bdr:#242428;--or:#FF6A00;--wh:#fff;--w2:#e0e0e0;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--w2);font-family:'Segoe UI',Arial,sans-serif;line-height:1.7;padding:32px 16px 60px;}
.wrap{max-width:520px;margin:0 auto;}
h1{font-weight:900;font-size:22px;color:var(--wh);margin-bottom:8px;}
p{font-size:13px;color:var(--w2);margin-bottom:20px;}
.card{background:var(--card);border:1px solid var(--bdr);border-radius:12px;padding:18px;margin-bottom:14px;}
.label{font-size:11px;font-weight:800;color:var(--or);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px;}
input{width:100%;background:#fff;border:1.5px solid var(--bdr);border-radius:8px;padding:12px 14px;font-size:14px;color:#000;outline:none;margin-bottom:14px;font-family:monospace;}
button{width:100%;background:var(--or);color:#fff;border:none;border-radius:10px;padding:16px;font-size:15px;font-weight:800;cursor:pointer;}
button:disabled{opacity:0.6;cursor:default;}
#status{margin-top:16px;font-size:13px;font-weight:700;padding:12px 14px;border-radius:8px;display:none;}
#status.ok{display:block;background:rgba(34,197,94,0.1);border:1px solid rgba(34,197,94,0.3);color:#4ade80;}
#status.err{display:block;background:rgba(244,63,94,0.1);border:1px solid rgba(244,63,94,0.3);color:#f43f5e;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Set Admin Password</h1>
  <p>Sets your admin login password directly in the database, no admin login needed for this one-time fix. Type the password here rather than it being saved anywhere in this page's code.</p>
  <div class="card">
    <div class="label">New admin password</div>
    <input type="text" id="pw-input" placeholder="Type the new password" autocomplete="off"/>
    <button id="go-btn" onclick="runFix()">Set Password Now</button>
    <div id="status"></div>
  </div>
  <p>Once it says success, go sign in to the admin panel with this password.</p>
</div>
<script>
async function runFix(){
  const btn=document.getElementById('go-btn');
  const status=document.getElementById('status');
  const pw=document.getElementById('pw-input').value;
  if(!pw||pw.length<4){status.className='err';status.style.display='block';status.textContent='Type the password first.';return;}
  btn.disabled=true;btn.textContent='Setting...';
  status.className='';status.style.display='none';
  const FB='https://richnation-portal-default-rtdb.firebaseio.com';
  try{
    const r=await fetch(FB+'/rn_mall_settings/adminPassword.json',{method:'PUT',body:JSON.stringify(pw)});
    if(!r.ok)throw new Error('Save failed (HTTP '+r.status+').');
    status.textContent='Success! Admin password updated. Go sign in with it now.';
    status.className='ok';
    btn.textContent='Done';
  }catch(e){
    status.textContent='Failed: '+e.message;
    status.className='err';
    btn.disabled=false;btn.textContent='Try Again';
  }
}
</script>
</body>
</html>
