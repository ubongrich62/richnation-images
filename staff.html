*{margin:0;padding:0;box-sizing:border-box;}
:root{

  --or:#FF6A00;--or-dk:#E15E00;--gold:#B8720A;--wh:#F5F5F6;--w2:#C7C7CD;--mu:#8F8F97;

}
html,body{color-scheme:dark;height:100%;font-family:'Inter',sans-serif;background:var(--bg);color:var(--wh);overflow-x:hidden;width:100%;}
@keyframes iconColorCycle{0%{stroke:#FF6A00;}50%{stroke:#ffffff;}100%{stroke:#FF6A00;}}
.icon-color-cycle{animation:none;}
::-webkit-scrollbar{width:4px;}::-webkit-scrollbar-track{background:#000;}::-webkit-scrollbar-thumb{background:#222;border-radius:4px;}
button{font-family:inherit;}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 30% 20%,rgba(255,106,0,0.07),transparent 55%),var(--bg);}
.lcard{width:100%;max-width:400px;background:var(--card);border:1px solid var(--bdr);border-radius:var(--r-lg);padding:36px 30px;box-shadow:var(--sh-lg);}
.llogo{text-align:center;font-family:'Plus Jakarta Sans',sans-serif;font-weight:900;font-size:20px;color:var(--or);margin-bottom:4px;}
.ltitle{text-align:center;font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:16px;margin-bottom:22px;color:var(--wh);}
.fi{width:100%;background:var(--bg);border:1px solid var(--bdr);border-radius:var(--r-sm);padding:12px 14px;color:var(--wh);font-size:13px;outline:none;margin-bottom:10px;transition:border-color .15s,box-shadow .15s;}

.lbtn{width:100%;background:var(--or);color:#fff;border:none;padding:13px;border-radius:var(--r-md);font-weight:800;font-size:13px;cursor:pointer;margin-top:4px;transition:background .15s;}

// App Check isn't enforced yet, so it adds nothing functional right now, loaded only
// after the page is fully done loading, so it costs the page nothing while unused.
function loadAppCheckWhenIdle(){
  function loadScript(src){
    return new Promise(function(resolve){
      const s=document.createElement('script');
      s.src=src;s.onload=resolve;s.onerror=resolve;
      document.head.appendChild(s);
    });

    });
}

// Loads the Firebase Auth SDK on demand (the first time a login/password-change actually
// happens, not on every page load) and initializes the app if nothing else has yet.
// Resolves to true once firebase.auth() is safe to call, or false if the SDK failed to

let _firebaseAuthReadyPromise=null;
function ensureFirebaseAuthReady(){
  if(_firebaseAuthReadyPromise)return _firebaseAuthReadyPromise;
  _firebaseAuthReadyPromise=new Promise(function(resolve){
    function loadScript(src){
      return new Promise(function(res){
        const s=document.createElement('script');
        s.src=src;s.onload=function(){res(true);};s.onerror=function(){res(false);};
        document.head.appendChild(s);
      });
    }
    function afterAppLoaded(){
      try{if(typeof firebase!=='undefined'&&(!firebase.apps||!firebase.apps.length))firebase.initializeApp(FIREBASE_CONFIG);}catch(e){}
      loadScript('https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js').then(function(ok){resolve(ok&&typeof firebase!=='undefined'&&!!firebase.auth);});

}

async function fbFetchTimeout(url,opts,ms){
  ms=ms||15000;const ctrl=new AbortController();const t=setTimeout(()=>ctrl.abort(),ms);
  opts=opts||{};
  if(typeof appCheckToken!=='undefined'&&appCheckToken)opts=Object.assign({},opts,{headers:Object.assign({},opts.headers,{'X-Firebase-AppCheck':appCheckToken})});
  try{const r=await fetch(url,Object.assign({},opts,{signal:ctrl.signal}));clearTimeout(t);return r;}
  catch(e){clearTimeout(t);throw e;}
}
function openDataDoc(uri){
  if(!uri)return;
  if(uri.indexOf('data:')!==0){window.open(uri,'_blank');return;}
  try{
    const commaIdx=uri.indexOf(',');
    const meta=uri.slice(0,commaIdx);
    const isBase64=meta.indexOf('base64')!==-1;
    const mimeMatch=meta.match(/data:([^;]+)/);
    const mime=mimeMatch?mimeMatch[1]:'application/octet-stream';
    const raw=isBase64?atob(uri.slice(commaIdx+1)):decodeURIComponent(uri.slice(commaIdx+1));
    const bytes=new Uint8Array(raw.length);
    for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);
    const blob=new Blob([bytes],{type:mime});
    window.open(URL.createObjectURL(blob),'_blank');
  }catch(e){toast('Could not open this document','err');}
}
async function fbG(p){try{const r=await fbFetchTimeout(FB+'/'+p+'.json',{});return await r.json();}catch(e){try{await new Promise(res=>setTimeout(res,400));const r2=await fbFetchTimeout(FB+'/'+p+'.json',{});return await r2.json();}catch(e2){return null;}}}
async function fbS(p,d){try{await fbFetchTimeout(FB+'/'+p+'.json',{method:'PUT',body:JSON.stringify(d)});}catch(e){}}
async function fbU(p,d){try{await fbFetchTimeout(FB+'/'+p+'.json',{method:'PATCH',body:JSON.stringify(d)});}catch(e){}}
async function fbP(p,d){try{const r=await fbFetchTimeout(FB+'/'+p+'.json',{method:'POST',body:JSON.stringify(d)});return await r.json();}catch(e){return null;}}
async function fbD(p){try{const r=await fbFetchTimeout(FB+'/'+p+'.json',{method:'DELETE'},4000);return !!(r&&r.ok);}catch{return false;}}
function watchFirebaseCollection(path,onChange){
  if(typeof EventSource==='undefined')return null;
  try{
    var es=new EventSource(FB+'/'+path+'.json');
    var debounceTimer=null;
    function triggerRefresh(){
      clearTimeout(debounceTimer);
      debounceTimer=setTimeout(function(){fbG(path).then(onChange);},300);
    }
    es.addEventListener('put',triggerRefresh);
    es.addEventListener('patch',triggerRefresh);
    es.onerror=function(){/* EventSource retries on its own, nothing to do here */};
    return es;
  }catch(e){console.warn('Live watch unavailable for',path,':',e.message);return null;}
}

}

// A record's own ID doubles as its access key everywhere in this app, so it must not
// be guessable. Date.now() alone produces a predictable, enumerable value, crypto.randomUUID() does not.
function secureId(prefix){
  try{if(window.crypto&&crypto.randomUUID)return prefix+'_'+crypto.randomUUID();}catch(e){}
  var bytes=new Uint8Array(16);
  (window.crypto||window.msCrypto).getRandomValues(bytes);
  var hex=Array.prototype.map.call(bytes,function(b){return b.toString(16).padStart(2,'0');}).join('');
  return prefix+'_'+hex;
}

async function doStaffLogin(){
  const email=document.getElementById('s-email').value.trim().toLowerCase();
  const pass=document.getElementById('s-pass').value.trim();
  const err=document.getElementById('login-err');err.style.display='none';
  if(!email||!pass){err.textContent='Enter your email and password.';err.style.display='block';return;}
  // Sign-in makes a single unavoidable network round-trip (looking up the staff
  // record) with no other visual change on screen until it resolves, so give it
  // an explicit loading state instead of leaving the button looking inert.
  const btn=document.getElementById('staff-login-btn');
  const origLabel=btn.textContent;
  btn.disabled=true;btn.textContent='Signing in…';
  try{
    function finishStaffLogin(found){
      if(found.status==='pending_review'){err.textContent='Your application is still under review. You\'ll be able to sign in once approved.';err.style.display='block';return;}
      if(found.status==='suspended'){err.textContent='Your account has been suspended. Contact your admin.';err.style.display='block';return;}
      staff=found;
      sessionStorage.setItem('rnm_staff_session',JSON.stringify(staff));
      sessionStorage.setItem('rnm_staff_email',staff.email);
      startApp();
    }
    const ready=await ensureFirebaseAuthReady();
    if(ready){
      try{
        const cred=await firebase.auth().signInWithEmailAndPassword(email,pass);
        const uid=cred.user.uid;
        let staffId=uid;
        let record=await fbG('rn_mall_staff/'+uid);
        if(!record){
          // Migrated account, its data still lives at the old key, look it up via
          // the index written when this account was upgraded (either at a prior
          // login here, or by admin.html at approval time for newly-approved staff).
          const oldId=await fbG('rn_mall_staff_by_uid/'+uid);
          if(oldId){staffId=oldId;record=await fbG('rn_mall_staff/'+oldId);}
        }
        if(!record){err.textContent='Account not found, please contact your admin.';err.style.display='block';return;}
        finishStaffLogin(Object.assign({_id:staffId},record));
        return;
      }catch(authErr){
        // Any Firebase Auth error (wrong password, no such account yet, etc.) falls
        // through to the legacy check below rather than failing immediately, that
        // check is what upgrades a not-yet-migrated account transparently.
      }
    }
    const all=await fbG('rn_mall_staff')||{};
    const byEmail=Object.entries(all).find(function(e){return e[1].email===email;});
    if(!byEmail){err.textContent='Incorrect email or password.';err.style.display='block';return;}
    const found=Object.assign({_id:byEmail[0]},byEmail[1]);
    if(found.status==='pending_review'){err.textContent='Your application is still under review. You\'ll be able to sign in once approved.';err.style.display='block';return;}
    if(found.status==='suspended'){err.textContent='Your account has been suspended. Contact your admin.';err.style.display='block';return;}
    if(found.password!==pass){err.textContent='Incorrect email or password.';err.style.display='block';return;}
    // Correct legacy credentials confirmed, transparently create this account's real
    // Firebase Auth record now using the exact password just typed, no separate reset
    // step needed, then link it so this fallback is never needed again for this account.
    let migrated=found;
    if(ready){
      try{
        const cred2=await firebase.auth().createUserWithEmailAndPassword(email,pass);
        const uid2=cred2.user.uid;
        const updates={authUid:uid2,password:null};
        await fbU('rn_mall_staff/'+found._id,updates);
        await fbS('rn_mall_staff_by_uid/'+uid2,found._id);
        migrated=Object.assign({},found,updates);
        delete migrated.password;
      }catch(migrateErr){
        console.warn('Auth migration on login failed, will retry next login:',migrateErr.message);
      }
    }
    finishStaffLogin(migrated);
  }finally{
    btn.disabled=false;btn.textContent=origLabel;
  }
}

async function snav(page){
  curNav=page;
  document.querySelectorAll('.sb-item').forEach(el=>el.classList.toggle('active',el.id==='nav-'+page));
  document.getElementById('sidebar').classList.remove('open');
  const c=document.getElementById('content');
  const routes={
    dashboard:renderDashboard,orders:renderOrders,products:renderProducts,vendors:renderVendorsView,
    analytics:renderAnalyticsView,customers:renderCustomersView,'wallet-issues':renderWalletIssuesView,
    'customer-chat':renderCustomerChatList,
    salary:renderSalary,points:renderPoints,reports:renderReports,complaints:renderComplaints,
    leave:renderLeave,messages:renderMessages,activity:renderMyActivity,policy:renderCompanyPolicy,profile:renderProfile,
    submissions:renderSubmissions,approvals:renderApprovals,fleet:renderFleet
  };
  // Render right away with whatever staff data is already cached, never make the
  // person wait on a network round-trip just to see the page they clicked into.
  (routes[page]||renderDashboard)(c);
  // Then quietly check for anything admin changed, and only re-render if this is
  // still the active page and something actually differs.
  const fresh=await fbG('rn_mall_staff/'+staff._id);
  if(fresh&&curNav===page){
    const changed=JSON.stringify(fresh)!==JSON.stringify(Object.assign({},staff,{_id:undefined}));
    staff=Object.assign({_id:staff._id},fresh);
    sessionStorage.setItem('rnm_staff_session',JSON.stringify(staff));
    document.getElementById('tb-role-badge').textContent=staff.name+', '+(ROLE_LABELS[staff.role]||staff.role);
    if(changed)(routes[page]||renderDashboard)(c);
  }
}

  const entries=Object.entries(data).sort(function(a,b){return (b[1].ts||0)-(a[1].ts||0);});
  const pending=entries.filter(function(e){return !e[1].status||e[1].status==='pending';});
  const submitted=entries.filter(function(e){return e[1].status==='submitted';});
  const approved=entries.filter(function(e){return e[1].status==='approved';});
  const statCard=document.getElementById('tasks-stat-card');
  if(statCard)statCard.innerHTML='<div class="stat-num" style="color:var(--su);">'+approved.length+'</div><div class="stat-lbl">Tasks Done</div><div class="stat-sub">'+(pending.length+submitted.length)+' pending</div>';
  if(!entries.length){el.innerHTML='<div style="color:var(--wh);font-weight:700;font-size:12px;">No tasks assigned yet.</div>';return;}
  function taskCard(e,mode){
    var t=e[1];
    var completionBlock='';
    if(mode==='pending'){
      completionBlock='<div style="margin-top:8px;"><textarea class="fi" id="tc-note-'+e[0]+'" rows="2" placeholder="What did you do? (required)" style="margin-bottom:6px;"></textarea>'
        +'<input class="fi" id="tc-link-'+e[0]+'" placeholder="Google link (optional)" style="margin-bottom:6px;"/>'
        +'<input class="fi" id="tc-file-'+e[0]+'" type="file" style="margin-bottom:6px;"/>'
        +'<button class="btn btn-or" style="font-size:11px;padding:6px 14px;" onclick="submitTaskCompletion(\''+e[0]+'\')">Submit for Approval</button></div>';
    }else if(mode==='submitted'){
      completionBlock='<div style="font-size:11px;color:var(--or);margin-top:6px;">⏳ Sent to admin, awaiting approval</div>'
        +(t.completionNote?'<div style="font-size:12px;color:var(--wh);font-weight:700;margin-top:4px;">'+t.completionNote+'</div>':'')
        +(t.completionLink?'<div style="margin-top:6px;"><a href="javascript:void(0)" data-uri="'+t.completionLink+'" onclick="openDataDoc(this.dataset.uri)" style="color:var(--or);font-size:11px;">View Link</a></div>':'')
        +(t.completionFile?'<div style="margin-top:6px;"><a href="javascript:void(0)" data-uri="'+t.completionFile+'" onclick="openDataDoc(this.dataset.uri)" style="color:var(--or);font-size:11px;">View File</a></div>':'');
    }else{
      completionBlock='<div style="font-size:11px;color:var(--su);margin-top:6px;">✔ Approved by '+(t.approvedBy||'Admin')+'</div>'+(t.completionNote?'<div style="font-size:12px;color:var(--wh);font-weight:700;margin-top:4px;">'+t.completionNote+'</div>':'');
    }
    return '<div style="padding:10px 0;border-top:1px solid var(--bdr);"><div style="font-size:13px;color:var(--wh);font-weight:700;font-weight:700;">'+t.description+'</div><div style="font-size:10px;color:var(--wh);font-weight:700;margin-top:3px;">Assigned by '+(t.assignedBy||'Admin')+(t.dueDate?' &middot; Due '+t.dueDate:'')+'</div>'+completionBlock+'</div>';
  }
  el.innerHTML=pending.map(function(e){return taskCard(e,'pending');}).join('')
    +submitted.map(function(e){return taskCard(e,'submitted');}).join('')
    +(approved.length?'<div style="font-size:10px;color:var(--wh);font-weight:700;text-transform:uppercase;margin-top:10px;padding-top:10px;border-top:1px solid var(--bdr);">Approved</div>'+approved.map(function(e){return taskCard(e,'approved');}).join(''):'');
}
async function submitTaskCompletion(taskKey){

  const file=document.getElementById('tc-file-'+taskKey).files[0];

  let fileData=null;
  if(file){toast('Uploading…');fileData=await fileToBase64(file);if(fileData){const url=isGithubConfigured()?await uploadDataUrlToGithub(fileData,'task-files'):null;if(url)fileData=url;}}
  await fbU('rn_mall_staff_tasks/'+staff._id+'/'+taskKey,{status:'submitted',completionNote:note,completionLink:link||null,completionFile:fileData,submittedAt:Date.now()});
  await fbP('rn_mall_notifications',{type:'staff_task_submitted',staffName:staff.name,description:(await fbG('rn_mall_staff_tasks/'+staff._id+'/'+taskKey)).description,date:ds(),read:false,ts:Date.now()});

  snav('dashboard');
}

const GITHUB_CONFIG={owner:'ubongrich62',repo:'richnation-images',branch:'main',token:'YOUR_FINE_GRAINED_TOKEN'};
function isGithubConfigured(){return GITHUB_CONFIG.owner!=='YOUR_GITHUB_USERNAME'&&GITHUB_CONFIG.token!=='YOUR_FINE_GRAINED_TOKEN';}
async function uploadDataUrlToGithub(dataUrl,folder){
  if(!isGithubConfigured())return null;
  try{
    const commaIdx=dataUrl.indexOf(',');
    const base64Content=dataUrl.slice(commaIdx+1);
    const mimeMatch=dataUrl.slice(0,commaIdx).match(/data:[^/]+\/([^;]+)/);
    const ext=(mimeMatch?mimeMatch[1]:'jpg').split('+')[0];
    const path='images/'+folder+'/'+Date.now()+'_'+Math.random().toString(36).slice(2,8)+'.'+ext;
    const apiUrl='https://api.github.com/repos/'+GITHUB_CONFIG.owner+'/'+GITHUB_CONFIG.repo+'/contents/'+path;
    const res=await fetch(apiUrl,{method:'PUT',headers:{'Authorization':'token '+GITHUB_CONFIG.token,'Content-Type':'application/json','Accept':'application/vnd.github+json'},body:JSON.stringify({message:'Upload '+path,content:base64Content,branch:GITHUB_CONFIG.branch})});
    if(!res.ok)throw new Error('GitHub upload failed: '+res.status);
    return 'https://raw.githubusercontent.com/'+GITHUB_CONFIG.owner+'/'+GITHUB_CONFIG.repo+'/'+GITHUB_CONFIG.branch+'/'+path;
  }catch(e){console.warn('GitHub image upload failed:',e);return null;}
}
function fileToBase64(file){
  return new Promise(function(resolve){
    var reader=new FileReader();
    reader.onload=function(e){resolve(e.target.result);};
    reader.onerror=function(){resolve(null);};
    reader.readAsDataURL(file);
  });
}

async function searchFleetMapLocation(query){

    }else{
      toast('Location not found','err');

  }catch(e){toast('Search failed, check your connection','err');}
}

async function reviewSubmission(id,decision){
  const note=prompt(decision==='approved'?'Optional note for the submitter (or leave blank):':'Feedback for the submitter (required for a rejection):');
  if(note===null)return;
  if(decision==='rejected'&&!note.trim()){toast('Feedback is required when rejecting','err');return;}
  const s=await fbG('rn_mall_staff_submissions/'+id);if(!s)return;
  await fbU('rn_mall_staff_submissions/'+id,{status:decision,reviewNote:note.trim()||null,reviewedBy:staff.name,reviewedAt:Date.now()});
  await fbP('rn_mall_staff_notifications/'+s.staffId,{type:decision==='approved'?'submission_approved':'submission_rejected',title:s.title,note:note.trim()||null,date:ds(),read:false,ts:Date.now()});
  toast(decision==='approved'?'Approved!':'Rejected, feedback sent');
  snav('approvals');
}

async function renderChannelChat(c,key,mode){
  if(mode==='general'){
    const settings=await fbG('rn_mall_settings')||{};
    if(settings.staffDiscussionOpen===false){
      c.innerHTML='<div class="card" style="text-align:center;padding:30px;color:var(--wh);font-weight:700;">🔒 General Discussion is currently closed by admin.</div>';
      return;
    }
  }
  c.innerHTML='<div class="card"><div id="ch-msgs" style="margin-bottom:12px;max-height:400px;overflow-y:auto;"></div><div style="display:flex;gap:8px;"><input class="inp" id="ch-input" placeholder="Type a message..." style="flex:1;" onkeydown="if(event.key===\'Enter\')sendChannelMsg(\''+key+'\',\''+mode+'\')"/><button class="btn btn-or" onclick="sendChannelMsg(\''+key+'\',\''+mode+'\')">Send</button></div></div>';
  await loadChannelMsgs(key,'ch-msgs');
}
async function sendChannelMsg(key,mode){
  const inp=document.getElementById('ch-input');const text=(inp.value||'').trim();if(!text)return;
  await fbP(key,{senderId:staff._id,senderName:staff.name,senderRole:staff.role,text,ts:Date.now(),date:ds()});
  const all=await fbG('rn_mall_staff')||{};
  const recipients=Object.entries(all).filter(function(e){
    if(e[0]===staff._id||e[1].status==='suspended'||e[1].status==='pending_review')return false;
    return mode==='general'||e[1].role===staff.role;
  });
  const notifType=mode==='general'?'general_discussion':'role_community';
  recipients.forEach(function(e){
    fbP('rn_mall_staff_notifications/'+e[0],{type:notifType,from:staff.name,preview:text.slice(0,80),date:ds(),read:false,ts:Date.now()});
  });
  inp.value='';await loadChannelMsgs(key,'ch-msgs');
}
async function loadChannelMsgs(key,elId,isDM){
  const msgsData=await fbG(key)||{};
  const entries=Object.entries(msgsData).sort(function(a,b){return (a[1].ts||0)-(b[1].ts||0);});
  const el=document.getElementById(elId);if(!el)return;
  el.innerHTML=entries.length?entries.map(function(e){
    var msgKey=e[0],m=e[1];
    const mine=m.senderId===staff._id;
    const senderRole=m.senderRole?(ROLE_LABELS[m.senderRole]||m.senderRole):'';
    const tick=isDM&&mine?'<div style="font-size:9px;color:'+(m.readByRecipient?'#5b9bf5':'var(--mu)')+';margin-top:2px;">'+(m.readByRecipient?'✔✔ Read':'✔ Sent')+'</div>':'';
    return '<div class="chat-msg'+(mine?' own':'')+'"><div class="chat-av">'+ini(m.senderName)+'</div><div><div class="chat-bubble">'+m.text+'</div><div style="font-size:9px;color:var(--wh);font-weight:700;margin-top:2px;">'+(mine?'You':m.senderName+(senderRole?', '+senderRole:''))+'</div>'+tick+'</div></div>';
  }).join(''):'<div style="color:var(--wh);font-weight:700;font-size:12px;text-align:center;padding:20px;">No messages yet, say hello!</div>';
  el.scrollTop=el.scrollHeight;
  if(isDM){
    entries.forEach(function(e){if(e[1].senderId!==staff._id&&!e[1].readByRecipient)fbU(key+'/'+e[0],{readByRecipient:true});});
  }
}

function compressPhotoFile(file,maxDim,quality){
  maxDim=maxDim||110;quality=quality||0.55;
  return new Promise(function(resolve){
    var reader=new FileReader();
    reader.onload=function(e){
      var img=new Image();
      img.onload=function(){
        try{
          var w=img.width,h=img.height;
          if(w>maxDim||h>maxDim){if(w>=h){h=Math.round(h*(maxDim/w));w=maxDim;}else{w=Math.round(w*(maxDim/h));h=maxDim;}}
          var canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;
          canvas.getContext('2d').drawImage(img,0,0,w,h);
          resolve(canvas.toDataURL('image/jpeg',quality));
        }catch(err){resolve(e.target.result);}
      };
      img.onerror=function(){resolve(e.target.result);};
      img.src=e.target.result;
    };
    reader.onerror=function(){resolve(null);};
    reader.readAsDataURL(file);
  });
}

  const c=document.getElementById('content');
  c.innerHTML='<div class="page-hdr-title">'+name+'</div><div class="card" style="margin-top:16px;"><div id="cc-msgs" style="margin-bottom:12px;max-height:400px;overflow-y:auto;"></div><div style="display:flex;gap:8px;"><input class="inp" id="cc-input" placeholder="Type your reply..." style="flex:1;" onkeydown="if(event.key===\'Enter\')sendStaffChatReply(\''+key+'\')"/><button class="btn btn-or" onclick="sendStaffChatReply(\''+key+'\')">Send</button></div><button class="btn" style="margin-top:10px;" onclick="snav(\'customer-chat\')">← Back</button></div>';
  await loadStaffChatMsgs(key);
}
async function loadStaffChatMsgs(key){
  const msgs=Object.values(await fbG('rn_mall_chat/'+key)||{}).sort(function(a,b){return (a.ts||0)-(b.ts||0);});
  const el=document.getElementById('cc-msgs');if(!el)return;
  el.innerHTML=msgs.length?msgs.map(function(m){
    return '<div class="chat-msg'+(m.isAdmin?' own':'')+'"><div class="chat-av">'+(m.isAdmin?'RN':ini(m.senderName||'?'))+'</div><div><div class="chat-bubble">'+m.text+'</div></div></div>';
  }).join(''):'<div style="color:var(--wh);font-weight:700;font-size:12px;text-align:center;padding:20px;">No messages yet.</div>';
  el.scrollTop=el.scrollHeight;
}
async function sendStaffChatReply(key){
  const inp=document.getElementById('cc-input');const text=(inp.value||'').trim();if(!text)return;
  await fbP('rn_mall_chat/'+key,{text:text,senderId:'staff',senderName:staff.name,isAdmin:true,ts:Date.now(),date:ds(),time:new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})});
  inp.value='';await loadStaffChatMsgs(key);
}
async function renderWalletIssuesView(c){
  c.innerHTML='<div class="page-hdr"><div class="page-hdr-title">Wallet Issues</div></div><div style="color:var(--wh);font-weight:700;">Loading...</div>';
  const data=Object.entries(await fbG('rn_mall_wallet_issues')||{}).map(function(e){return Object.assign({_id:e[0]},e[1]);}).sort(function(a,b){return (b.ts||0)-(a.ts||0);});
  c.innerHTML='<div class="page-hdr"><div class="page-hdr-title">Wallet Issues</div></div>'+data.map(function(iss){
    var actions='';
    if(iss.status==='pending'&&(iss.type==='refund'||iss.type==='wrong_topup')){
      actions='<button class="btn btn-or" style="font-size:10px;padding:5px 10px;" onclick="staffApproveIssue(\''+iss._id+'\')">Approve</button>';
    }else if(iss.status==='processing'){
      actions='<button class="btn btn-or" style="font-size:10px;padding:5px 10px;" onclick="staffMarkIssuePaid(\''+iss._id+'\')">Mark as Paid</button>';
    }
    return '<div class="data-row"><div style="flex:1;"><div class="row-name">'+iss.customerName+', '+iss.type+(iss.amount?', '+fmt(iss.amount):'')+'</div><div class="row-meta">'+iss.message+'</div><div class="row-meta">'+iss.status+'</div></div>'+actions+'</div>';
  }).join('');
}
async function staffApproveIssue(id){
  const iss=await fbG('rn_mall_wallet_issues/'+id);if(!iss)return;
  await fbU('rn_mall_wallet_issues/'+id,{status:'approved_awaiting_bank'});
  await fbP('rn_mall_customer_notifications/'+iss.customerId,{type:'points_earned',message:'Your refund request was approved! Please go to your Wallet and enter your bank details.',date:new Date().toLocaleDateString(),read:false,ts:Date.now()});
  toast('Approved');snav('wallet-issues');
}
async function staffMarkIssuePaid(id){
  const iss=await fbG('rn_mall_wallet_issues/'+id);if(!iss)return;
  if(!confirm('Confirm payment sent to '+iss.bankAcctName+'?'))return;
  await fbU('rn_mall_wallet_issues/'+id,{status:'paid'});
  await fbP('rn_mall_customer_notifications/'+iss.customerId,{type:'points_earned',message:fmt(iss.amount||0)+' has been sent to your bank account.',date:new Date().toLocaleDateString(),read:false,ts:Date.now()});
  toast('Marked paid');snav('wallet-issues');
}

// ── NOTIFICATIONS ──
function notifIcon(type){
  var map={dm:'chat',general_discussion:'note',role_community:'user',salary_paid:'money',salary_set:'money',points_awarded:'star',hours_set:'clock',strike:'alert',bank_verified:'file',withdrawal_paid:'money',withdrawal_declined:'alert',submission_approved:'star',submission_rejected:'alert',task_assigned:'note',task_approved:'star'};
  return iconBadge(map[type]||'bell',15);
}
function notifMsg(n){
  if(n.type==='dm')return n.from+' sent you a message: "'+n.preview+'"';
  if(n.type==='general_discussion')return n.from+' posted in General Discussion: "'+n.preview+'"';
  if(n.type==='role_community')return n.from+' posted in your team channel: "'+n.preview+'"';
  if(n.type==='salary_paid')return fmt(n.amount)+' salary payment sent'+(n.description?' ('+n.description+')':'')+'. '+(n.message||'');
  if(n.type==='salary_set')return 'Your monthly salary was set to '+fmt(n.amount);
  if(n.type==='points_awarded')return 'You earned '+n.amount+' StaffPoints, '+(n.reason||'');
  if(n.type==='hours_set')return 'Your working hours were set to: '+n.hours;
  if(n.type==='strike')return n.strikes>=3?'You have been automatically suspended after 3 strikes, pending review. Last strike: '+n.reason:'You received a strike ('+n.strikes+'/3): '+n.reason;
  if(n.type==='bank_verified')return 'Your bank account details have been verified by admin.';
  if(n.type==='withdrawal_paid')return 'Your withdrawal of '+fmt(n.amount)+' has been paid.';
  if(n.type==='withdrawal_declined')return 'Your withdrawal request for '+fmt(n.amount)+' was declined.';
  if(n.type==='submission_approved')return '"'+n.title+'" was approved'+(n.note?', '+n.note:'')+'.';
  if(n.type==='submission_rejected')return '"'+n.title+'" needs changes, '+(n.note||'see feedback in My Submissions')+'.';
  if(n.type==='task_assigned')return 'New task assigned: '+n.description+(n.dueDate?', due '+n.dueDate:'')+'.';
  if(n.type==='task_approved')return 'Your task completion was approved.';
  return n.preview||'New notification';
}
async function loadStaffNotifs(){
  if(!staff)return;
  const data=await fbG('rn_mall_staff_notifications/'+staff._id)||{};
  const list=Object.entries(data).map(function(e){return Object.assign({_key:e[0]},e[1]);}).sort(function(a,b){return (b.ts||0)-(a.ts||0);});
  const unread=list.filter(function(n){return !n.read;}).length;
  const badge=document.getElementById('staff-notif-badge');
  if(badge){badge.textContent=unread;badge.style.display=unread>0?'flex':'none';}
  const panel=document.getElementById('staff-notif-panel');
  if(panel){
    panel.innerHTML=list.length?list.slice(0,25).map(function(n){
      return '<div style="display:flex;gap:8px;padding:8px;border-radius:8px;background:'+(n.read?'transparent':'rgba(255,106,0,0.06)')+';margin-bottom:2px;"><div style="font-size:15px;">'+notifIcon(n.type)+'</div><div style="flex:1;"><div style="font-size:11px;color:var(--wh);line-height:1.4;">'+notifMsg(n)+'</div><div style="font-size:9px;color:var(--wh);font-weight:700;margin-top:2px;">'+n.date+'</div></div></div>';
    }).join(''):'<div style="padding:16px;text-align:center;color:var(--wh);font-weight:700;font-size:12px;">No notifications yet.</div>';
  }
  return data;
}
async function toggleStaffNotifPanel(){
  const panel=document.getElementById('staff-notif-panel');
  const open=panel.style.display==='block';
  panel.style.display=open?'none':'block';
  if(!open){
    // loadStaffNotifs() already fetched this exact path, reuse its result
    // instead of fetching rn_mall_staff_notifications/<id> a second time.
    const data=await loadStaffNotifs()||{};
    for(const k of Object.keys(data)){if(!data[k].read)fbU('rn_mall_staff_notifications/'+staff._id+'/'+k,{read:true});}
    setTimeout(loadStaffNotifs,600);
  }
}
setInterval(function(){if(staff)loadStaffNotifs();},10000);

checkStaffSession();
</script>
